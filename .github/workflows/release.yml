name: release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Read version
        id: meta
        shell: bash
        run: |
          POM_VERSION="$(awk -F'[<>]' '/<version>/ {print $3; exit}' pom.xml)"
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$POM_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Prepare jar
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -f "target/JByteMod-ReForked-${VERSION}.jar"
          mkdir -p release-files
          cp "target/JByteMod-ReForked-${VERSION}.jar" release-files/
          cd release-files
          sha256sum -- "JByteMod-ReForked-${VERSION}.jar" > SHA256SUMS-jar.txt

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          {
            echo "## JByteMod ReForked ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows installer | \`JByteMod-ReForked-${VERSION}-windows-x64.msi\` |"
            echo "| Windows portable | \`JByteMod-ReForked-${VERSION}-windows-x64-portable.zip\` |"
            echo "| macOS | \`JByteMod-ReForked-${VERSION}-macos-arm64.dmg\` |"
            echo "| Linux (Debian/Ubuntu) | \`JByteMod-ReForked-${VERSION}-linux-x64.deb\` |"
            echo "| Linux portable | \`JByteMod-ReForked-${VERSION}-linux-x64-portable.tar.gz\` |"
            echo "| Any OS (needs JDK 25) | \`JByteMod-ReForked-${VERSION}.jar\` |"
            echo
            echo "Installers bundle their own Java runtime and are attached to this release as each platform finishes building. They are not code-signed, so Windows SmartScreen or macOS Gatekeeper may ask for confirmation on first launch. Verify downloads with the \`SHA256SUMS-*.txt\` files."
            echo
            echo "### Changes"
            echo
            if [[ -z "$PREVIOUS_TAG" ]]; then
              git log HEAD --pretty=format:"- %s (%h)"
            else
              echo "_Changes since ${PREVIOUS_TAG}_"
              echo
              git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: JByteMod ReForked Build ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build installers
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bash packaging/build-installer.sh

      - name: Create checksums
        shell: bash
        working-directory: target/installers
        run: |
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum -- * > "SHA256SUMS-${{ matrix.name }}.txt"
          else
            shasum -a 256 -- * > "SHA256SUMS-${{ matrix.name }}.txt"
          fi

      - name: Attach installers to release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ github.run_number }}
          files: target/installers/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
