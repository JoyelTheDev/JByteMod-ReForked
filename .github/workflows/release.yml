name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read and verify version
        id: meta
        shell: bash
        run: |
          POM_VERSION="$(awk -F'[<>]' '/<version>/ {print $3; exit}' pom.xml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the pom.xml version $POM_VERSION"
              exit 1
            fi
          fi
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$POM_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-jar:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Check jar
        run: test -f "target/JByteMod-ReForked-${{ needs.verify.outputs.version }}.jar"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/JByteMod-ReForked-${{ needs.verify.outputs.version }}.jar
          if-no-files-found: error

  installers:
    needs: [verify, build-jar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build installers
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash packaging/build-installer.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: target/installers/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-jar, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-files
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## JByteMod ReForked ${VERSION}"
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows installer | \`JByteMod-ReForked-${VERSION}-windows-x64.msi\` |"
            echo "| Windows portable | \`JByteMod-ReForked-${VERSION}-windows-x64-portable.zip\` |"
            echo "| macOS | \`JByteMod-ReForked-${VERSION}-macos-arm64.dmg\` |"
            echo "| Linux (Debian/Ubuntu) | \`JByteMod-ReForked-${VERSION}-linux-x64.deb\` |"
            echo "| Linux portable | \`JByteMod-ReForked-${VERSION}-linux-x64-portable.tar.gz\` |"
            echo "| Any OS (needs JDK 25) | \`JByteMod-ReForked-${VERSION}.jar\` |"
            echo
            echo "Installers bundle their own Java runtime. They are not code-signed, so Windows SmartScreen or macOS Gatekeeper may ask for confirmation on first launch. Verify downloads with \`SHA256SUMS.txt\`."
            echo
            echo "### Changes"
            echo
            if [[ -z "$PREVIOUS_TAG" ]]; then
              git log "$GITHUB_REF_NAME" --pretty=format:"- %s (%h)"
            else
              echo "_Changes since ${PREVIOUS_TAG}_"
              echo
              git log "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: JByteMod ReForked v${{ needs.verify.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
